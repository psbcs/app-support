<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PSB CS Support</title>
  <meta name="description" content="Support for the PSB CS iOS app.">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1d1d1f;
      background: linear-gradient(160deg, #eaf1ff 0%, #f7f9fc 55%, #ffffff 100%);
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 520px;
      padding: 44px 36px;
      text-align: center;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(20, 60, 140, 0.12);
    }
    .logo {
      display: block;
      width: 96px;
      height: 96px;
      margin: 0 auto 20px;
    }
    h1 { margin: 0 0 12px; font-size: 30px; letter-spacing: -0.5px; }
    p { margin: 0; font-size: 16px; line-height: 1.6; color: #515154; }
    .btn {
      display: inline-block;
      margin: 22px 0 26px;
      padding: 13px 26px;
      border-radius: 12px;
      background: #0a5cff;
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      transition: background .2s, transform .2s;
    }
    .btn:hover { background: #0846c2; transform: translateY(-1px); }
    .tip {
      padding: 16px 18px;
      border-radius: 14px;
      background: #f3f6fc;
      font-size: 14px;
      text-align: left;
    }
    .tip strong { color: #1d1d1f; }
    @media (max-width: 480px) {
      .card { padding: 36px 24px; }
      h1 { font-size: 26px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="logo-512.png" alt="PSB CS logo">
    <h1>PSB CS Support</h1>
    <p>Need help with PSB CS? Email us at</p>
    <a class="btn" href="mailto:psbcs.support@proton.me">psbcs.support@proton.me</a>
    <p class="tip">
      <strong>Reporting a problem?</strong> Please include your iPhone model, iOS version, and what you were doing when it happened.
    </p>
  </main>
</body>
</html>
